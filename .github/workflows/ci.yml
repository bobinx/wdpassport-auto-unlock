name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: make test PYTHON=python

      - name: Run code validation
        run: make lint PYTHON=python

      - name: Test staged installation
        run: |
          make install DESTDIR=/tmp/stage
          test -x /tmp/stage/usr/local/bin/wd-auto-unlock
          test -f /tmp/stage/etc/systemd/system/wd-unlock.service
          test -f /tmp/stage/etc/systemd/system/wd-unlock.timer
          test -f /tmp/stage/etc/udev/rules.d/99-wd-passport.rules
          test -f /tmp/stage/etc/wdpassport.conf
          /tmp/stage/usr/local/bin/wd-auto-unlock --version
          /tmp/stage/usr/local/bin/wd-auto-unlock --help

      - name: Test staged uninstallation
        run: |
          make uninstall DESTDIR=/tmp/stage
          test ! -f /tmp/stage/usr/local/bin/wd-auto-unlock
          test ! -f /tmp/stage/etc/systemd/system/wd-unlock.service
          test ! -f /tmp/stage/etc/systemd/system/wd-unlock.timer
          test ! -f /tmp/stage/etc/udev/rules.d/99-wd-passport.rules
          # Config must be preserved
          test -f /tmp/stage/etc/wdpassport.conf
          rm -rf /tmp/stage
